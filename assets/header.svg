    <text x="425" y="149" fill="#211a35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">DSA</text>
    <rect x="10" y="35" width="78" height="52" rx="8" fill="#f6c4d9" opacity="0.9"/>
    <text x="29" y="66" fill="#211a35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">AWS</text>
