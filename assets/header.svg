    <g fill="#d8c8ff">
      <circle cx="662" cy="91" r="4"/>
      <circle cx="745" cy="64" r="3"/>
      <circle cx="856" cy="96" r="4"/>
      <circle cx="957" cy="70" r="3"/>
      <circle cx="1042" cy="108" r="4"/>
