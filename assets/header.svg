<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">welcome to ashka's workspace</title>
  <desc id="desc">A dark academic developer desk with a laptop, moon, stars, sticky notes, and a subtle cosmic roadmap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d22"/>
      <stop offset="0.46" stop-color="#171037"/>
      <stop offset="1" stop-color="#271448"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1740"/>
      <stop offset="1" stop-color="#31235d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101936"/>
      <stop offset="1" stop-color="#090d1d"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe8a3" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffe8a3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="324" rx="24" fill="none" stroke="#d8c8ff" stroke-opacity="0.16"/>
  <circle cx="219" cy="126" r="126" fill="url(#lampGlow)"/>

  <g opacity="0.84">
