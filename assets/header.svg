<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">welcome to ashka's workspace</title>
  <desc id="desc">A dark academic developer desk with a laptop, moon, stars, sticky notes, and a subtle cosmic roadmap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c20"/>
      <stop offset="0.48" stop-color="#151137"/>
      <stop offset="1" stop-color="#2a1649"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11172f" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#22164a" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#191735"/>
      <stop offset="1" stop-color="#39255f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b3b"/>
      <stop offset="1" stop-color="#080d1e"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe8a3" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffe8a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="30" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="344" rx="24" fill="none" stroke="#d8c8ff" stroke-opacity="0.16"/>
  <rect x="44" y="48" width="1112" height="286" rx="25" fill="url(#panel)" stroke="#d8c8ff" stroke-opacity="0.1"/>

  <circle cx="233" cy="125" r="132" fill="url(#lampGlow)"/>
  <g opacity="0.82">
    <path d="M618 91 C695 35 753 142 830 92 S967 48 1033 112" fill="none" stroke="#b8a7ff" stroke-width="2" stroke-dasharray="7 10" stroke-linecap="round"/>
    <path d="M646 164 C720 112 787 204 858 153 S994 104 1102 174" fill="none" stroke="#ffe8a3" stroke-width="1.5" stroke-dasharray="5 11" stroke-opacity="0.6" stroke-linecap="round"/>
    <g fill="#d8c8ff">
      <circle cx="618" cy="91" r="4"/>
      <circle cx="720" cy="62" r="3"/>
      <circle cx="830" cy="92" r="4"/>
      <circle cx="936" cy="72" r="3"/>
      <circle cx="1033" cy="112" r="4"/>
      <circle cx="646" cy="164" r="3"/>
      <circle cx="752" cy="140" r="4"/>
      <circle cx="858" cy="153" r="3"/>
      <circle cx="1001" cy="128" r="4"/>
      <circle cx="1102" cy="174" r="3"/>
    </g>
  </g>

  <g fill="#f8f4e8" opacity="0.78">
    <circle cx="128" cy="75" r="2"/>
    <circle cx="241" cy="58" r="1.7"/>
    <circle cx="460" cy="82" r="1.5"/>
    <circle cx="588" cy="49" r="2"/>
    <circle cx="1118" cy="65" r="1.8"/>
    <path d="M106 169 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
    <path d="M1115 94 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="1041" cy="78" r="34" fill="#f8f4e8"/>
    <circle cx="1055" cy="68" r="32" fill="#171037"/>
  </g>

  <g transform="translate(100 122)">
    <rect x="6" y="152" width="478" height="40" rx="14" fill="url(#desk)"/>
    <rect x="74" y="23" width="292" height="171" rx="16" fill="#0b1026" stroke="#d8c8ff" stroke-opacity="0.28"/>
    <rect x="91" y="42" width="258" height="112" rx="9" fill="url(#screen)"/>
    <circle cx="108" cy="59" r="4" fill="#ff9aa8"/>
    <circle cx="123" cy="59" r="4" fill="#ffe8a3"/>
    <circle cx="138" cy="59" r="4" fill="#93e5c9"/>
    <text x="108" y="88" fill="#c7d2fe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">ashka@workspace:~$ build</text>
    <rect x="108" y="104" width="98" height="8" rx="4" fill="#d8c8ff" opacity="0.72"/>
    <rect x="108" y="123" width="174" height="8" rx="4" fill="#8fb3ff" opacity="0.62"/>
    <rect x="108" y="141" width="130" height="8" rx="4" fill="#ffe8a3" opacity="0.66"/>
    <path d="M42 194 H398 L363 226 H76 Z" fill="#11172f"/>
    <path d="M174 205 H270 L284 216 H160 Z" fill="#d8c8ff" opacity="0.22"/>

    <rect x="0" y="60" width="76" height="52" rx="8" fill="#f6c4d9" opacity="0.94"/>
    <text x="21" y="92" fill="#211a35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">AWS</text>
    <rect x="18" y="124" width="92" height="52" rx="8" fill="#b9e6ff" opacity="0.9"/>
    <text x="33" y="156" fill="#211a35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">UI bugs</text>
    <rect x="392" y="45" width="74" height="56" rx="8" fill="#ffe8a3" opacity="0.94"/>
    <text x="412" y="78" fill="#211a35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">ML</text>
    <rect x="382" y="120" width="88" height="56" rx="8" fill="#d8c8ff" opacity="0.96"/>
    <text x="403" y="153" fill="#211a35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">DSA</text>
  </g>

  <g>
    <rect x="585" y="200" width="492" height="86" rx="22" fill="#0b1026" opacity="0.42" stroke="#d8c8ff" stroke-opacity="0.16"/>
    <text x="614" y="237" fill="#f8f4e8" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">welcome to ashka’s workspace</text>
    <text x="617" y="267" fill="#d8c8ff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">one project, one bug, one slightly-too-ambitious idea at a time</text>
    <rect x="617" y="286" width="338" height="2" rx="1" fill="#ffe8a3" opacity="0.52"/>
  </g>
</svg>
