<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Language and tools map</title>
  <desc id="desc">A self-contained language map card showing Ashka's main tools.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.58" stop-color="#17143a"/>
      <stop offset="1" stop-color="#24164b"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffe8a3" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#d8c8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="760" height="300" rx="18" fill="url(#card)"/>
  <rect x="18" y="18" width="724" height="264" rx="14" fill="none" stroke="#d8c8ff" stroke-opacity="0.18"/>

  <text x="42" y="60" fill="#f8f4e8" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">language map</text>
  <text x="42" y="91" fill="#d8c8ff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">the current constellation of tools i keep returning to</text>

  <path d="M430 68 C485 38 538 92 594 63 S684 48 720 86" fill="none" stroke="url(#trail)" stroke-width="2" stroke-dasharray="6 9" stroke-linecap="round"/>
  <circle cx="430" cy="68" r="3" fill="#d8c8ff"/>
  <circle cx="594" cy="63" r="3.5" fill="#ffe8a3"/>
  <circle cx="720" cy="86" r="3" fill="#d8c8ff"/>

  <g transform="translate(42 126)">
    <rect width="314" height="114" rx="14" fill="#111833" stroke="#d8c8ff" stroke-opacity="0.14"/>
    <text x="22" y="34" fill="#ffe8a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">core languages</text>
    <rect x="22" y="52" width="224" height="14" rx="7" fill="#ffe8a3"/>
    <text x="256" y="65" fill="#f8f4e8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Python</text>
    <rect x="22" y="78" width="174" height="14" rx="7" fill="#d8c8ff"/>
    <text x="206" y="91" fill="#f8f4e8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">TypeScript</text>
  </g>

  <g transform="translate(404 126)">
    <rect width="314" height="114" rx="14" fill="#111833" stroke="#d8c8ff" stroke-opacity="0.14"/>
    <text x="22" y="34" fill="#ffe8a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">build + deploy</text>
    <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">
      <rect x="22" y="52" width="74" height="26" rx="13" fill="#f6c4d9" opacity="0.95"/>
      <text x="43" y="70" fill="#211a35">Flask</text>
      <rect x="106" y="52" width="86" height="26" rx="13" fill="#93e5c9" opacity="0.95"/>
      <text x="125" y="70" fill="#142622">FastAPI</text>
      <rect x="202" y="52" width="82" height="26" rx="13" fill="#b9e6ff" opacity="0.95"/>
      <text x="219" y="70" fill="#18213a">Angular</text>
      <rect x="22" y="86" width="62" height="26" rx="13" fill="#ffc98b" opacity="0.95"/>
      <text x="39" y="104" fill="#2a1b12">AWS</text>
      <rect x="94" y="86" width="62" height="26" rx="13" fill="#d8c8ff" opacity="0.95"/>
      <text x="113" y="104" fill="#211a35">SQL</text>
      <rect x="166" y="86" width="94" height="26" rx="13" fill="#ffe8a3" opacity="0.95"/>
      <text x="185" y="104" fill="#211a35">pandas</text>
    </g>
  </g>

  <text x="42" y="266" fill="#d8c8ff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">not a fixed stack, more like a working map that changes as the projects get real</text>
</svg>
