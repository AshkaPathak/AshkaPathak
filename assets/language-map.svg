<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-labelledby="title desc">
  <title id="title">Language and tools map</title>
  <desc id="desc">A self-contained language map card showing Ashka's main tools.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#24164b"/>
    </linearGradient>
  </defs>
  <rect width="580" height="210" rx="16" fill="url(#card)"/>
  <rect x="14" y="14" width="552" height="182" rx="12" fill="none" stroke="#d8c8ff" stroke-opacity="0.18"/>
  <text x="34" y="48" fill="#f8f4e8" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">language map</text>
  <text x="34" y="75" fill="#d8c8ff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">the current constellation of tools i keep returning to</text>
  <g transform="translate(34 104)" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">
    <rect x="0" y="0" width="168" height="18" rx="9" fill="#ffe8a3"/>
    <text x="0" y="-10" fill="#f8f4e8">Python</text>
    <rect x="0" y="34" width="132" height="18" rx="9" fill="#d8c8ff"/>
    <text x="0" y="24" fill="#f8f4e8">TypeScript</text>
    <rect x="0" y="68" width="116" height="18" rx="9" fill="#b9e6ff"/>
    <text x="0" y="58" fill="#f8f4e8">SQL</text>
    <rect x="260" y="0" width="142" height="18" rx="9" fill="#f6c4d9"/>
    <text x="260" y="-10" fill="#f8f4e8">Flask / FastAPI</text>
    <rect x="260" y="34" width="128" height="18" rx="9" fill="#93e5c9"/>
    <text x="260" y="24" fill="#f8f4e8">Angular</text>
    <rect x="260" y="68" width="104" height="18" rx="9" fill="#ffc98b"/>
    <text x="260" y="58" fill="#f8f4e8">AWS</text>
  </g>
</svg>
