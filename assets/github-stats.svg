<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">GitHub profile snapshot</title>
  <desc id="desc">A self-contained dark profile snapshot card for AshkaPathak.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.58" stop-color="#17143a"/>
      <stop offset="1" stop-color="#2a1649"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffe8a3" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d8c8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="760" height="280" rx="18" fill="url(#card)"/>
  <rect x="18" y="18" width="724" height="244" rx="14" fill="none" stroke="#d8c8ff" stroke-opacity="0.18"/>

  <g opacity="0.78">
    <path d="M460 55 C508 30 551 85 596 58 S682 46 716 80" fill="none" stroke="url(#trail)" stroke-width="2" stroke-dasharray="6 9" stroke-linecap="round"/>
    <circle cx="460" cy="55" r="3" fill="#d8c8ff"/>
    <circle cx="596" cy="58" r="3.5" fill="#ffe8a3"/>
    <circle cx="716" cy="80" r="3" fill="#d8c8ff"/>
  </g>

  <text x="42" y="60" fill="#f8f4e8" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">github snapshot</text>
  <text x="42" y="91" fill="#d8c8ff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">AshkaPathak · building in public, learning in layers</text>

  <g transform="translate(42 124)">
    <rect width="302" height="98" rx="14" fill="#111833" stroke="#d8c8ff" stroke-opacity="0.14"/>
    <text x="22" y="33" fill="#ffe8a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">current orbit</text>
    <text x="22" y="62" fill="#f8f4e8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">full-stack + ML</text>
    <text x="22" y="84" fill="#d8c8ff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">projects, coursework, and deployment lessons</text>
  </g>

  <g transform="translate(384 124)">
    <rect width="150" height="98" rx="14" fill="#151b36" stroke="#d8c8ff" stroke-opacity="0.14"/>
    <circle cx="27" cy="31" r="7" fill="#ffe8a3"/>
    <text x="48" y="36" fill="#f8f4e8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">shipping</text>
    <circle cx="27" cy="64" r="7" fill="#d8c8ff"/>
    <text x="48" y="69" fill="#f8f4e8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">studying</text>
  </g>

  <g transform="translate(560 124)">
    <rect width="150" height="98" rx="14" fill="#151b36" stroke="#d8c8ff" stroke-opacity="0.14"/>
    <text x="20" y="33" fill="#ffe8a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">builder mode</text>
    <text x="20" y="62" fill="#f8f4e8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700">curious</text>
    <text x="20" y="83" fill="#d8c8ff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">and persistent</text>
  </g>

  <rect x="42" y="242" width="676" height="2" rx="1" fill="#ffe8a3" opacity="0.38"/>
</svg>
