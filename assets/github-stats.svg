<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-labelledby="title desc">
  <title id="title">GitHub profile snapshot</title>
  <desc id="desc">A self-contained dark profile snapshot card for AshkaPathak.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#261449"/>
    </linearGradient>
  </defs>
  <rect width="580" height="210" rx="16" fill="url(#card)"/>
  <rect x="14" y="14" width="552" height="182" rx="12" fill="none" stroke="#d8c8ff" stroke-opacity="0.18"/>
  <text x="34" y="48" fill="#f8f4e8" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">github snapshot</text>
  <text x="34" y="75" fill="#d8c8ff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">AshkaPathak · building in public, learning in layers</text>
  <g transform="translate(34 104)">
    <rect width="150" height="64" rx="12" fill="#151b36" stroke="#d8c8ff" stroke-opacity="0.14"/>
    <text x="18" y="28" fill="#ffe8a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">focus</text>
    <text x="18" y="49" fill="#f8f4e8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">full-stack + ML</text>
  </g>
  <g transform="translate(214 104)">
    <rect width="150" height="64" rx="12" fill="#151b36" stroke="#d8c8ff" stroke-opacity="0.14"/>
    <text x="18" y="28" fill="#ffe8a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">mode</text>
    <text x="18" y="49" fill="#f8f4e8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">shipping + studying</text>
  </g>
  <g transform="translate(394 104)">
    <rect width="150" height="64" rx="12" fill="#151b36" stroke="#d8c8ff" stroke-opacity="0.14"/>
    <text x="18" y="28" fill="#ffe8a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">vibe</text>
    <text x="18" y="49" fill="#f8f4e8" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">curious builder</text>
  </g>
</svg>
